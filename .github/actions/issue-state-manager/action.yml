name: 'Issue State Manager'
description: 'Update GitHub issue description with current sync state'

inputs:
  github_token:
    description: 'GitHub token for API access'
    required: true
  issue_number:
    description: 'Issue number to update'
    required: true
  upstream_version:
    description: 'Upstream commit SHA'
    required: true
  sync_branch:
    description: 'Sync branch name'
    required: true
  commit_count:
    description: 'Number of commits in sync'
    required: true

runs:
  using: "composite"
  steps:
    - name: Update issue state
      shell: bash
      run: |
        "$GITHUB_ACTION_PATH/update-issue-state.sh" \
          "$ISSUE_NUMBER" \
          "$UPSTREAM_VERSION" \
          "$SYNC_BRANCH" \
          "$COMMIT_COUNT"
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        ISSUE_NUMBER: ${{ inputs.issue_number }}
        UPSTREAM_VERSION: ${{ inputs.upstream_version }}
        SYNC_BRANCH: ${{ inputs.sync_branch }}
        COMMIT_COUNT: ${{ inputs.commit_count }}