name: 'Java Build'
description: 'Reusable Java build action that handles build, test, and artifact upload'

inputs:
  generate_coverage:
    description: 'Whether to generate coverage report'
    required: false
    default: 'false'
  maven_profile:
    description: 'Optional Maven profile(s) to restrict the build (e.g. core,azure — a comma-separated list is allowed). When empty, no -P is passed; validate.yml supplies the core,azure default (ADR-035).'
    required: false
  build_env:
    description: 'The fork''s BUILD_ENV variable: KEY=VALUE lines exported before Maven runs, with $GITHUB_WORKSPACE expanded. Empty exports nothing.'
    required: false
    default: ''

outputs:
  is_java_project:
    description: "Whether this is a Java project"
    value: ${{ steps.check_pom.outputs.has_pom }}
  build_result:
    description: "Result of the build process"
    value: ${{ steps.build.outcome }}

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      if: |
        github.event_name != 'pull_request_target' ||
        github.event.pull_request.base.ref != 'fork_upstream' ||
        !startsWith(github.event.pull_request.head.ref, 'sync/')
      with:
        # On pull_request_target a ref-less checkout would silently replace the PR
        # head the calling workflow checked out with the base branch.
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0

    - name: "Assert the PR head is checked out"
      if: github.event_name == 'pull_request_target'
      shell: bash
      env:
        EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: |
        HEAD_SHA="$(git rev-parse HEAD)"
        if [ "$HEAD_SHA" != "$EXPECTED_HEAD_SHA" ]; then
          echo "::error::Workspace is at $HEAD_SHA, not the PR head $EXPECTED_HEAD_SHA; validation would build the wrong revision"
          exit 1
        fi

    - name: "Check for pom.xml"
      id: check_pom
      shell: bash
      run: |
        if [ -f "pom.xml" ] || [ -n "$(find . -name 'pom.xml' -type f)" ]; then
          echo "has_pom=true" >> $GITHUB_OUTPUT
        else
          echo "has_pom=false" >> $GITHUB_OUTPUT
        fi

    - name: "Resolve Java release"
      if: steps.check_pom.outputs.has_pom == 'true'
      id: java
      shell: bash
      run: |
        VERSION=$(python3 "$GITHUB_ACTION_PATH/../java-release/resolve.py" pom.xml)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: "Setup Java Environment"
      if: steps.check_pom.outputs.has_pom == 'true'
      uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
      with:
        java-version: ${{ steps.java.outputs.version }}
        distribution: 'temurin'
        cache: 'maven'
        cache-dependency-path: '**/pom.xml'

    - name: "Setup Maven"
      if: steps.check_pom.outputs.has_pom == 'true'
      uses: ./.github/actions/setup-maven

    - name: "Export build environment"
      if: steps.check_pom.outputs.has_pom == 'true' && inputs.build_env != ''
      shell: bash
      env:
        BUILD_ENV: ${{ inputs.build_env }}
      run: bash "$GITHUB_ACTION_PATH/build-env.sh"

    - name: "Build and Test"
      if: steps.check_pom.outputs.has_pom == 'true'
      id: build
      shell: bash
      run: |
        mvn -v

        # flatten substitutes the version into pom comments, so keep it to [A-Za-z0-9._-] with no '--'.
        SAFE_REF=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._' '-' | tr -s '-')
        MAVEN_CLI_OPTS="--batch-mode -Drevision=${SAFE_REF}-SNAPSHOT"
        
        if [ -f ".mvn/community-maven.settings.xml" ]; then
          MAVEN_CLI_OPTS="$MAVEN_CLI_OPTS --settings=.mvn/community-maven.settings.xml"
        fi

        # Profiles come from env and are validated whole (ADR-035): bash =~ anchors against the
        # entire string, so an embedded newline cannot smuggle in a second option.
        if [ -n "${MAVEN_PROFILE:-}" ]; then
          if [[ ! "$MAVEN_PROFILE" =~ ^[A-Za-z0-9][A-Za-z0-9._,-]*$ ]]; then
            echo "::error::Invalid maven_profile '${MAVEN_PROFILE}' (allowed characters: A-Z a-z 0-9 . _ , -)"
            exit 1
          fi
          MAVEN_CLI_OPTS="$MAVEN_CLI_OPTS -P $MAVEN_PROFILE"
        fi

        if [[ "$GENERATE_COVERAGE" == "true" ]]; then
          # verify, not package: a check the pom binds to verify must gate the pull request too.
          mvn $MAVEN_CLI_OPTS clean verify org.jacoco:jacoco-maven-plugin:0.8.14:report
          
          echo "# Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "## Summary" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          find . -name "index.html" -path "*/target/site/jacoco/*" -exec grep -o '<tfoot>.*</tfoot>' {} \; | sed 's/<[^>]*>//g' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        else
          mvn $MAVEN_CLI_OPTS clean install
        fi
      env:
        MAVEN_OPTS: "-Dmaven.repo.local=$HOME/.m2/repository"
        MAVEN_PROFILE: ${{ inputs.maven_profile }}
        GENERATE_COVERAGE: ${{ inputs.generate_coverage }}

    - name: "Upload Build Artifacts"
      if: steps.check_pom.outputs.has_pom == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: build-artifacts
        path: |
          **/target/*.jar
          **/target/maven-*-output.txt
        retention-days: 2

    - name: "Upload Coverage Report"
      if: steps.check_pom.outputs.has_pom == 'true' && inputs.generate_coverage == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: coverage-report
        path: '**/target/site/jacoco/'
        retention-days: 2
