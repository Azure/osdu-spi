version: 2
updates:
  # Template repository only. The template owns the engineering system (.github
  # workflows and actions); forks own application code and receive .github
  # updates through sync-template, never through their own Dependabot.

  - package-ecosystem: "github-actions"
    directory: "/.github"
    schedule:
      interval: "daily"
      time: "08:00"
    target-branch: "main"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7

  # Bumps the base image digest in build/Dockerfile; template-sync carries the
  # updated Dockerfile to every fork (ADR-037). The App Insights agent is an ADD
  # with a checksum, not a FROM, so its version bump stays manual.
  - package-ecosystem: "docker"
    directory: "/build"
    schedule:
      interval: "daily"
      time: "08:30"
    target-branch: "main"
    labels:
      - "dependencies"
    groups:
      docker:
        patterns:
          - "*"
    open-pull-requests-limit: 5

  # No pip ecosystem for doc/: a fork inherits this file until
  # deploy-fork-resources.sh replaces it, and Dependabot caches the ecosystem.
