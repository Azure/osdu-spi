version: 2
updates:
  # Maven only: workflow and action updates arrive through template sync.
  # Patch updates only, one PR per dependency: a grouped PR that reaches an upstream-owned
  # pom is closed whole, which would take the fork-owned bumps down with it.

  - package-ecosystem: "maven"
    directories:
      - "/provider/*-azure"
      - "/testing/*-test-azure"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    target-branch: "main"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # Build tooling is pinned by hand.
      - dependency-name: "org.jacoco:*"
      - dependency-name: "io.github.git-commit-id:*"
      - dependency-name: "org.projectlombok:lombok"
      - dependency-name: "org.apache.maven.plugins:*"
      - dependency-name: "org.springframework.boot:spring-boot-maven-plugin"
