version: 2
updates:
  # Maven only: workflow and action updates arrive through template sync.
  # Patch updates only, with Spring, logging, Jackson, and Azure SDK grouped.

  - package-ecosystem: "maven"
    directories:
      - "/"
      - "/*-core"
      - "/*-acceptance-test"
      - "/provider/*-azure"
      - "/testing"
      - "/testing/*-test-core"
      - "/testing/*-test-azure"
    schedule:
      interval: "daily"
      time: "09:00"
    target-branch: "main"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      # Build tooling is pinned by hand.
      - dependency-name: "org.jacoco:*"
      - dependency-name: "io.github.git-commit-id:*"
      - dependency-name: "org.projectlombok:lombok"
      - dependency-name: "org.apache.maven.plugins:*"
      - dependency-name: "org.springframework.boot:spring-boot-maven-plugin"
    groups:
      spring:
        patterns:
          - "org.springframework*"
          - "org.springframework.boot:*"
          - "org.springframework.security:*"
          - "org.springdoc:*"
      logging:
        patterns:
          - "org.slf4j:*"
          - "ch.qos.logback:*"
          - "org.apache.logging.log4j:*"
      jackson:
        patterns:
          - "com.fasterxml.jackson*"
          - "net.minidev:json-smart"
      azure:
        patterns:
          - "com.azure:*"
          - "com.azure.spring:*"
          - "com.microsoft.azure:*"
