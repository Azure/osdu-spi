name: CodeQL Analysis

on:
  push:
    branches: [ main, fork_upstream, fork_integration ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Mondays at 6 AM UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  check-paths:
    name: Check if Code Changes Present
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.filter.outputs.should-run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0

      - name: Check for code changes
        id: filter
        run: |
          # For scheduled runs and workflow_dispatch, always run
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
            echo "Running CodeQL: Scheduled or manual trigger"
            exit 0
          fi

          # For push events, check against previous commit
          if [ "${{ github.event_name }}" = "push" ]; then
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          # For pull requests, check against base branch
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            echo "should-run=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get list of changed files
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || echo "")

          if [ -z "$CHANGED_FILES" ]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
            echo "Running CodeQL: Unable to determine changed files"
            exit 0
          fi

          # Skip only when every changed file is Markdown. Markdown is not an
          # analyzed language, so this can never hide a finding.
          #
          # The previous pattern anchored its alternation with $, so the
          # .github/, .mvn/, devops/ and docs/ branches only matched those exact
          # bare strings and never a real path. .github/** was ignored purely by
          # the ^\..* dotfile catch-all, so a PR that rewrote workflows reported
          # a green CodeQL with nothing analyzed at all (#142).
          SHOULD_RUN=false
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              *.md) continue ;;
            esac
            SHOULD_RUN=true
            break
          done <<< "$CHANGED_FILES"

          if [ "$SHOULD_RUN" = "true" ]; then
            echo "should-run=true" >> $GITHUB_OUTPUT
            echo "Running CodeQL: non-Markdown changes detected"
          else
            echo "should-run=false" >> $GITHUB_OUTPUT
            echo "Skipping CodeQL: only Markdown files changed"
          fi

  detect-languages:
    needs: check-paths
    if: needs.check-paths.outputs.should-run == 'true'
    name: Detect Project Languages
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.detect.outputs.languages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1

      - name: Detect languages
        id: detect
        run: |
          LANGUAGES='[]'

          # Check for Java (Maven or Gradle)
          if [ -f "pom.xml" ] || [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
            LANGUAGES=$(echo "$LANGUAGES" | jq -c '. + ["java-kotlin"]')
          fi

          # Check for Python (exclude build directories and common generated code paths)
          if [ -f "setup.py" ] || [ -f "pyproject.toml" ] || [ -f "requirements.txt" ] || \
             find . -name "*.py" \
               -not -path "./.*" \
               -not -path "*/build/*" \
               -not -path "*/build-*/*" \
               -not -path "*/target/*" \
               -not -path "*/dist/*" \
               -not -path "*/__pycache__/*" \
               -not -path "*/.venv/*" \
               -not -path "*/venv/*" \
               -not -path "*/.pytest_cache/*" \
               -not -path "*/.mypy_cache/*" \
               -not -path "*/node_modules/*" | grep -q .; then
            LANGUAGES=$(echo "$LANGUAGES" | jq -c '. + ["python"]')
          fi

          # Check for JavaScript/TypeScript
          if [ -f "package.json" ] || find . -name "*.js" -o -name "*.ts" -not -path "./node_modules/*" -not -path "./.*" | grep -q .; then
            LANGUAGES=$(echo "$LANGUAGES" | jq -c '. + ["javascript-typescript"]')
          fi

          # Check for Go
          if [ -f "go.mod" ] || find . -name "*.go" -not -path "./.*" | grep -q .; then
            LANGUAGES=$(echo "$LANGUAGES" | jq -c '. + ["go"]')
          fi

          # Default to java-kotlin if no source language detected (OSDU is primarily Java)
          if [ "$LANGUAGES" = "[]" ]; then
            LANGUAGES='["java-kotlin"]'
          fi

          # actions is always analyzed. Every fork ships .github/workflows/, so
          # detection would be pointless -- the answer is always yes -- and
          # workflow YAML is precisely what this analysis exists to review (#142).
          LANGUAGES=$(echo "$LANGUAGES" | jq -c '. + ["actions"]')

          echo "languages=$LANGUAGES" >> $GITHUB_OUTPUT
          echo "Analyzing languages: $LANGUAGES"

  analyze:
    name: Analyze Code
    needs: [check-paths, detect-languages]
    if: needs.check-paths.outputs.should-run == 'true' && needs.detect-languages.outputs.languages != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect-languages.outputs.languages) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1

      - name: Setup Java
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Setup Python
        if: matrix.language == 'python'
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: '3.x'

      - name: Setup Node.js
        if: matrix.language == 'javascript-typescript'
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f  # v6.3.0
        with:
          node-version: '18'
          cache: 'npm'

      - name: Initialize CodeQL
        # Commit SHA, not the v4.30.8 annotated-tag object SHA: the tag object is not a
        # commit, so the REST commits API cannot resolve it and Dependabot cannot bump it.
        uses: github/codeql-action/init@f443b600d91635bebf5b0d9ebc620189c0d6fba5  # v4.30.8
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: none
          config: |
            paths-ignore:
              - '**/build/**'
              - '**/build-*/**'
              - '**/target/**'
              - '**/dist/**'
              - '**/__pycache__/**'
              - '**/.venv/**'
              - '**/venv/**'
              - '**/node_modules/**'
              - '**/.pytest_cache/**'
              - '**/.mypy_cache/**'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@f443b600d91635bebf5b0d9ebc620189c0d6fba5  # v4.30.8
        with:
          category: "/language:${{matrix.language}}"

  # Summary job that always reports as "CodeQL" to satisfy required status checks
  # This job name matches the required check context in repository rulesets
  CodeQL:
    name: CodeQL
    runs-on: ubuntu-latest
    needs: [check-paths, detect-languages, analyze]
    if: always()
    steps:
      - name: Report CodeQL Status
        run: |
          # Check if check-paths succeeded
          if [ "${{ needs.check-paths.result }}" != "success" ]; then
            echo "❌ Code path check failed"
            exit 1
          fi

          # Analysis is legitimately unnecessary only when every change is Markdown
          if [ "${{ needs.check-paths.outputs.should-run }}" = "false" ]; then
            echo "✅ CodeQL skipped - only Markdown files changed"
            exit 0
          fi

          # If should-run is true, check that analysis completed successfully
          if [ "${{ needs.detect-languages.result }}" != "success" ]; then
            echo "❌ Language detection failed"
            exit 1
          fi

          # actions is always in the language list, so it can never be empty.
          # A skipped analyze at this point means the job never started, which
          # is an infrastructure fault and must not be reported as a pass.
          if [ "${{ needs.analyze.result }}" = "skipped" ]; then
            echo "❌ CodeQL analysis did not run despite non-Markdown changes"
            exit 1
          fi

          # Check for actual failures
          if [ "${{ needs.analyze.result }}" = "failure" ] || [ "${{ needs.analyze.result }}" = "cancelled" ]; then
            echo "❌ CodeQL analysis failed or was cancelled"
            exit 1
          fi

          echo "✅ CodeQL checks completed successfully"