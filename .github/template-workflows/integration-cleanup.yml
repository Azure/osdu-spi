name: Integration Branch Cleanup

on:
  # push, not a pull request event: this runs main's own copy with no PR code in reach (ADR-036).
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read
  issues: write

concurrency:
  group: integration-cleanup-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update-integration-branch:
    name: "🔄 Update Fork Integration"
    runs-on: ubuntu-latest
    steps:
      - name: Find the merged integration PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "Manual run: resetting fork_integration to main"
            echo "matched=true" >> "$GITHUB_OUTPUT"
            echo "summary=Manual reset of fork_integration to main" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Also match by head branch: a manual PR merged without the upstream-sync
          # label would otherwise leave fork_integration stuck ahead of main.
          PR_NUMBER=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '
            [.[] | select(.merged_at != null and .base.ref == "main")
                 | select(any(.labels[]; .name == "upstream-sync")
                          or .head.ref == "fork_integration"
                          or (.head.ref | startswith("release/upstream-")))]
            | .[0].number // empty')
          if [ -z "$PR_NUMBER" ]; then
            echo "Push to main is not an integration merge; nothing to clean up"
            echo "matched=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Integration PR #$PR_NUMBER merged"
          echo "matched=true" >> "$GITHUB_OUTPUT"
          echo "summary=Production PR #$PR_NUMBER merged to main" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.pr.outputs.matched == 'true'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        if: steps.pr.outputs.matched == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fast-forward fork_integration to main
        id: update_integration
        if: steps.pr.outputs.matched == 'true'
        run: |
          echo "Fetching latest branch states..."
          git fetch origin --prune

          if ! git show-ref --verify --quiet refs/remotes/origin/main; then
            echo "❌ Error: origin/main branch not found"
            exit 1
          fi
          if ! git show-ref --verify --quiet refs/remotes/origin/fork_integration; then
            echo "❌ Error: fork_integration branch not found"
            exit 1
          fi

          echo "Checking out fork_integration branch..."
          git checkout -b fork_integration --track origin/fork_integration 2>/dev/null || git checkout fork_integration

          COMMITS_BEHIND=$(git rev-list --count fork_integration..origin/main)
          COMMITS_AHEAD=$(git rev-list --count origin/main..fork_integration)

          echo "Current state:"
          echo "  fork_integration is $COMMITS_AHEAD commits ahead of main"
          echo "  fork_integration is $COMMITS_BEHIND commits behind main"

          if [ "$COMMITS_AHEAD" = "0" ] && [ "$COMMITS_BEHIND" = "0" ]; then
            echo "✅ fork_integration is already in sync with main - no update needed"
            echo "updated=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Resetting fork_integration to match main..."
          git reset --hard origin/main

          echo "Pushing updated fork_integration..."
          git push -f origin fork_integration

          echo "✅ Successfully synchronized fork_integration with main"
          echo "  Previous state: $COMMITS_AHEAD ahead, $COMMITS_BEHIND behind"
          echo "  New state: In sync with main"
          echo "updated=true" >> $GITHUB_OUTPUT

      - name: Close upstream-held issues
        if: steps.update_integration.outputs.updated == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGED_BY: ${{ steps.pr.outputs.summary }}
        run: |
          HELD_ISSUES=$(gh issue list --label "upstream-held" --json number,title --state open)
          HELD_COUNT=$(echo "$HELD_ISSUES" | jq 'length')

          if [ "$HELD_COUNT" -gt 0 ]; then
            echo "Found $HELD_COUNT upstream-held issue(s) to process"

            ISSUE_NUMBERS=$(echo "$HELD_ISSUES" | jq -r '.[].number')
            if [ -z "$ISSUE_NUMBERS" ]; then
              echo "Warning: Found issues but could not extract issue numbers"
              exit 1
            fi

            echo "$ISSUE_NUMBERS" | while read ISSUE_NUMBER; do
              echo "Closing upstream-held issue #$ISSUE_NUMBER..."

              gh issue comment "$ISSUE_NUMBER" --body "✅ **Integration Complete - Processing Held Changes** - $(date '+%Y-%m-%d %H:%M:%S UTC')

              The integration pipeline has completed successfully:
              - $MERGED_BY
              - \`fork_integration\` branch synchronized with \`main\`
              - Pipeline cleared for processing held upstream changes

              **Next Steps:**
              - Held upstream changes will be processed in the next cascade run
              - Monitor for new upstream sync issues
              - No manual action required

              Closing this tracking issue as integration is complete."

              gh issue close "$ISSUE_NUMBER"
              echo "✅ Closed issue #$ISSUE_NUMBER"
            done
          else
            echo "No upstream-held issues found - nothing to close"
          fi

      - name: Log completion
        if: steps.update_integration.outputs.updated == 'true'
        env:
          MERGED_BY: ${{ steps.pr.outputs.summary }}
        run: |
          echo "✅ Integration cleanup completed successfully"
          echo ""
          echo "Summary:"
          echo "  - $MERGED_BY"
          echo "  - fork_integration branch synchronized with main"
          echo "  - Integration pipeline cleared for new cascades"
          echo "  - Upstream-held issues processed"
          echo ""
          echo "The cascade pipeline is now ready to process new upstream changes."
