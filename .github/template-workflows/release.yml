name: Release Management

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-initialization:
    name: "Check Repository"
    runs-on: ubuntu-latest
    outputs:
      initialized: ${{ steps.check.outputs.initialized }}
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        
      - name: "Verify Initialization Status"
        id: check
        run: |
          if [ "${{ vars.INITIALIZATION_COMPLETE }}" = "true" ]; then
            echo "initialized=true" >> $GITHUB_OUTPUT
          else
            echo "initialized=false" >> $GITHUB_OUTPUT
          fi
          
  release-please:
    name: "📦 Create Release"
    needs: check-initialization
    if: needs.check-initialization.outputs.initialized == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      # Manifest config (.release-please-config.json) emits path-prefixed outputs; fall back to top-level.
      version: ${{ steps.release.outputs['.--version'] || steps.release.outputs.version }}
      tag_name: ${{ steps.release.outputs['.--tag_name'] || steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs['.--sha'] || steps.release.outputs.sha }}
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: "Generate GitHub App Token"
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: "Generate Release PR"
        uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38  # v4.4.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: .release-please-config.json
          
  tag-with-upstream:
    name: "🏷️ Update Release Tags"
    needs: [check-initialization, release-please]
    if: needs.check-initialization.outputs.initialized == 'true' && needs.release-please.outputs.release_created
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: write

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: "Checkout Code"
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0
          
      - name: "Fetch Upstream Version"
        env:
          UPSTREAM_REPO_URL: ${{ vars.UPSTREAM_REPO_URL }}
        run: |
          git remote add upstream "$UPSTREAM_REPO_URL"
          git fetch upstream --tags --force

          if git rev-parse --verify upstream/main >/dev/null 2>&1; then
            DEFAULT_BRANCH="main"
          elif git rev-parse --verify upstream/master >/dev/null 2>&1; then
            DEFAULT_BRANCH="master"
          else
            echo "::error::Could not find main or master branch in upstream"
            exit 1
          fi

          # Matches sync.yml: a tag only when it points at the upstream tip, otherwise
          # the short upstream SHA, so the correlation tag agrees with the meta commit.
          UPSTREAM_SHA=$(git rev-parse "upstream/$DEFAULT_BRANCH")
          UPSTREAM_VERSION=$(git describe --tags --exact-match "$UPSTREAM_SHA" 2>/dev/null || echo "${UPSTREAM_SHA:0:8}")
          echo "UPSTREAM_VERSION=$UPSTREAM_VERSION" >> $GITHUB_ENV
          
      - name: "Update Release Tags"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        run: |
          RELEASE_TAG="${TAG_NAME:-$(gh release list -L 1 | cut -f 3)}"
          # From the API, not the local ref: the upstream tag fetch above can overwrite a same-named tag.
          RELEASE_SHA="${RELEASE_SHA:-$(gh api "repos/${GH_REPO}/commits/${RELEASE_TAG}" --jq .sha)}"
          
          # Additive: the release tag itself is never moved.
          CORRELATION_TAG="${RELEASE_TAG}-upstream-${UPSTREAM_VERSION}"
          
          if ! git tag -l "${CORRELATION_TAG}" | grep -q .; then
            git tag "$CORRELATION_TAG" "$RELEASE_SHA"
            git push origin "$CORRELATION_TAG"
          fi
          
          RELEASE_NOTES=$(gh release view $RELEASE_TAG --json body -q .body)
          gh release edit $RELEASE_TAG \
            --notes "${RELEASE_NOTES}

            Upstream Version: ${UPSTREAM_VERSION}
            Correlation Tag: ${CORRELATION_TAG}"

  retag-image:
    name: "🏷️ Tag Release Image"
    needs: [check-initialization, release-please]
    # Gate on version presence (robust to manifest-prefixed vs top-level release-please outputs).
    if: needs.check-initialization.outputs.initialized == 'true' && needs.release-please.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write         # registry-side retag of the already-pushed image
    steps:
      - name: "Log in to GHCR"
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Resolve release commit"
        # The release can be created on a later push than the one that merged it, so the images
        # and the descriptor come from the commit the release tag names, not from GITHUB_SHA.
        id: commit
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sha="$RELEASE_SHA"
          if [ -z "$sha" ] && [ -n "$TAG_NAME" ]; then
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${TAG_NAME}" --jq .sha)
          fi
          [ -n "$sha" ] || { echo "::error::could not resolve the release commit for ${TAG_NAME:-this release}"; exit 1; }
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:12}" >> "$GITHUB_OUTPUT"
          echo "Release commit: \`${sha}\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0

      - name: "Switch to the release commit"
        # The helper comes from the triggering commit, which carries this workflow; an older
        # release commit may predate it.
        env:
          RELEASE_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          set -euo pipefail
          cp .github/actions/release-retag/retag.sh "$RUNNER_TEMP/retag.sh"
          git checkout -q --detach "$RELEASE_SHA"

      - name: "Tag release image with semver"
        id: service_tag
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
          REPO_NAME: ${{ github.event.repository.name }}
          SHORT_SHA: ${{ steps.commit.outputs.short }}
        run: |
          set -euo pipefail
          # Registry-side retag: add :<version> to the release commit's image. No rebuild.
          OWNER_LC=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          SERVICE=$(printf '%s' "${SERVICE_NAME:-$REPO_NAME}" | tr '[:upper:]' '[:lower:]')
          REPO="ghcr.io/${OWNER_LC}/${SERVICE}"
          # The immutable :sha-<short> of the release commit, not :main-snapshot, which can still
          # point at an earlier commit while validate.yml's docker-push is building.
          "$RUNNER_TEMP/retag.sh" "${REPO}:sha-${SHORT_SHA}" "${REPO}:${VERSION}"
          echo "repo=${REPO}" >> "$GITHUB_OUTPUT"

      - name: "Resolve acceptance suite"
        # After the service retag on purpose: a malformed .spi/service.yaml exits 2, and the
        # service image, which the descriptor has nothing to do with, must be tagged first.
        id: suite
        run: .github/actions/acceptance-image/resolve-suite.sh
        env:
          SERVICE_NAME: ${{ vars.SERVICE_NAME || github.event.repository.name }}
          RESOLVER: .github/actions/acceptance-resolver/resolve.py

      - name: "Tag acceptance image with semver"
        # Same commit as the service image, so "prove release X on stack Y" stays one command later.
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          REPO: ${{ steps.service_tag.outputs.repo }}
          SHORT_SHA: ${{ steps.commit.outputs.short }}
          ACCEPTANCE_BUILDABLE: ${{ steps.suite.outputs.buildable }}
        run: |
          set -euo pipefail
          if [ "${ACCEPTANCE_BUILDABLE}" != "true" ]; then
            echo "No acceptance suite on this commit; acceptance image retag skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          "$RUNNER_TEMP/retag.sh" "${REPO}-acceptance:sha-${SHORT_SHA}" "${REPO}-acceptance:${VERSION}"

      - name: "Resolve load payload"
        id: payload
        run: .github/actions/load-image/resolve-payload.sh

      - name: "Tag load image with semver"
        # Same commit as the service image (ADR-042); the stack selects the loader at the
        # service's commit, so the release tag must name both.
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          REPO: ${{ steps.service_tag.outputs.repo }}
          SHORT_SHA: ${{ steps.commit.outputs.short }}
          LOAD_BUILDABLE: ${{ steps.payload.outputs.buildable }}
        run: |
          set -euo pipefail
          if [ "${LOAD_BUILDABLE}" != "true" ]; then
            echo "No shared-schemas payload on this commit; load image retag skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          "$RUNNER_TEMP/retag.sh" "${REPO}-load:sha-${SHORT_SHA}" "${REPO}-load:${VERSION}"
