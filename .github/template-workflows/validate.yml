name: Validation

on:
  # No paths-ignore on either PR trigger: a path-skipped workflow leaves the required
  # "📋 Validation Summary" check Pending and wedges the PR (ADR-030). check-paths gates the heavy jobs.
  pull_request:
    branches: [main, fork_integration, fork_upstream]
  pull_request_target:
    branches: [main, fork_integration, fork_upstream]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, fork_integration, fork_upstream]
    paths-ignore:
      - '.github/workflows/**'
      - '.github/template-workflows/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/actions/**'
      - '.github/*.md'
      - '.github/*.json'
      - '.github/*.yml'
      - '.github/*.yaml'
      - '.github/.template-sync-commit'
      - '.vscode/**'
      - 'docs/**'
      - '**.md'
      - '**.txt'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:
    inputs:
      post_init:
        description: 'Is this a post-initialization validation?'
        required: false
        type: boolean
        default: false
      initialization_complete:
        description: 'Force initialization status (used during post-init)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  check-initialization:
    name: "🔍 Check Initialization Status"
    # One lane per PR: same-repo sync/ PRs take pull_request_target, which reads this file from
    # the default branch (fork_upstream has none in filter mode). Every other PR takes pull_request.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       !(github.event.pull_request.head.repo.full_name == github.repository &&
         startsWith(github.event.pull_request.head.ref, 'sync/'))) ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'sync/')) ||
      (github.event_name == 'push' && 
       !contains(github.event.head_commit.message, 'chore: complete repository initialization') &&
       !contains(github.event.head_commit.message, 'chore: clean up template files after initialization'))
    runs-on: ubuntu-latest
    outputs:
      initialized: ${{ steps.check.outputs.initialized }}
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          # pull_request_target must build the PR head, not the base.
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: "Verify Initialization Status"
        id: check
        run: |
          echo "🔍 Debug: Event name = '${{ github.event_name }}'"
          echo "🔍 Debug: Repository variable INITIALIZATION_COMPLETE = '${{ vars.INITIALIZATION_COMPLETE }}'"
          echo "🔍 Debug: Workflow input initialization_complete = '${{ inputs.initialization_complete }}'"
          echo "🔍 Debug: Workflow input post_init = '${{ inputs.post_init }}'"
          
          INITIALIZED=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.initialization_complete }}" = "true" ]; then
            INITIALIZED=true
            echo "✅ Initialization confirmed via workflow input"
          elif [ "${{ vars.INITIALIZATION_COMPLETE }}" = "true" ]; then
            INITIALIZED=true
            echo "✅ Initialization confirmed via repository variable"
          else
            echo "🔍 Checking structural indicators for initialization..."
            if git ls-remote --heads origin | grep -q "refs/heads/fork_upstream" && \
               git ls-remote --heads origin | grep -q "refs/heads/fork_integration" && \
               ([ -f "pom.xml" ] || [ -n "$(find . -name 'pom.xml' -type f 2>/dev/null)" ]); then
              INITIALIZED=true
              echo "✅ Initialization detected via structural indicators"
            fi
          fi
          
          if [ "$INITIALIZED" = "true" ]; then
            echo "initialized=true" >> $GITHUB_OUTPUT
            echo "✅ Repository is initialized"
          else
            echo "initialized=false" >> $GITHUB_OUTPUT
            echo "⏸️ Repository not yet initialized"
          fi

  check-repo-state:
    name: "🔍 Check Repository State"
    needs: check-initialization
    if: needs.check-initialization.outputs.initialized == 'true'
    runs-on: ubuntu-latest
    outputs:
      is_initialized: ${{ steps.check_init.outputs.initialized }}
      is_java_repo: ${{ steps.check_java.outputs.is_java }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: "Check Repository Initialization"
        id: check_init
        run: |
          if [ -f "pom.xml" ] || [ -d "src" ]; then
            echo "initialized=true" >> $GITHUB_OUTPUT
          else
            echo "initialized=false" >> $GITHUB_OUTPUT
          fi

      - name: "Check if Java Repository"
        id: check_java
        run: |
          if [ -f "pom.xml" ] || [ -n "$(find . -name 'pom.xml' -type f)" ]; then
            echo "is_java=true" >> $GITHUB_OUTPUT
          else
            echo "is_java=false" >> $GITHUB_OUTPUT
          fi

  check-paths:
    name: "🔍 Check for Build-Relevant Changes"
    needs: check-initialization
    if: needs.check-initialization.outputs.initialized == 'true'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          # pull_request_target diffs against the PR head; pull_request resolves to the merge sha.
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: "Check for build-relevant changes"
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Build-relevant: ${{ github.event_name }} trigger"
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || echo "")

          if [ -z "$CHANGED_FILES" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Build-relevant: unable to determine changed files"
            exit 0
          fi

          # .mvn/ is never config-only: the build copies its settings file into Maven settings.
          SHOULD_RUN=false
          while IFS= read -r file; do
            case "$file" in .mvn/*) SHOULD_RUN=true; break ;; esac
            if echo "$file" | grep -qE '^(\.github/|devops/|docs/|\..*|.*\.md)$'; then
              continue
            fi
            SHOULD_RUN=true
            break
          done <<< "$CHANGED_FILES"

          echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT
          if [ "$SHOULD_RUN" = "true" ]; then
            echo "Build-relevant: code changes detected"
          else
            echo "Skipping build: only config/docs paths changed"
          fi

  java-build:
    name: "🔨 Java Build"
    needs: [check-initialization, check-repo-state, check-paths]
    # Dependabot PRs build in dependabot-validation.yml; config-only PRs skip the build.
    if: |
      needs.check-repo-state.outputs.is_initialized == 'true' &&
      needs.check-repo-state.outputs.is_java_repo == 'true' &&
      needs.check-paths.outputs.should_run == 'true' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      is_java_project: ${{ steps.build.outputs.is_java_project }}
      build_result: ${{ steps.build.outputs.build_result }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: "Restore local actions for sync PRs"
        if: |
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.base.ref == 'fork_upstream' &&
          startsWith(github.event.pull_request.head.ref, 'sync/')
        run: |
          set -euo pipefail
          # Sync branches carry no .github/actions; validate with main's trusted copy.
          echo "🔧 Restoring local actions from main branch for sync PR validation..."
          if ! git fetch origin main --depth=1; then
            echo "❌ Failed to fetch 'main' branch from origin. Cannot restore local actions."
            exit 1
          fi
          if ! git checkout origin/main -- .github/actions/; then
            echo "❌ Failed to restore .github/actions/ from origin/main. Cannot proceed with validation."
            exit 1
          fi
          echo "✅ Local actions restored - validation can proceed"

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Cache Maven packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

          
      - name: Setup Maven Settings
        run: |
          if [ -f ".mvn/community-maven.settings.xml" ]; then
            mkdir -p ~/.m2
            cp .mvn/community-maven.settings.xml ~/.m2/settings.xml
            echo "📝 Maven settings configured from .mvn/community-maven.settings.xml"
          else
            echo "📝 No custom Maven settings found, using defaults"
          fi
        
      - name: "Run Java Build"
        id: build
        uses: ./.github/actions/java-build
        with:
          generate_coverage: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
          # core is activeByDefault, so a bare profile flag would drop it (ADR-035). Filter-mode
          # fork_upstream builds core only: its azure profile points at fork-owned directories that
          # exist only after the cascade merge. Mirror-mode fork_upstream carries provider/ (ADR-039).
          maven_profile: ${{ ((github.base_ref == 'fork_upstream' || github.ref_name == 'fork_upstream') && vars.SYNC_MODE != 'mirror') && 'core' || vars.MAVEN_PROFILE || 'core,azure' }}

  docker-build:
    # Validate-only build of both images; the trusted push is docker-push and the required check
    # is the summary job at the end.
    # Skipped for filter-mode fork_upstream, which builds core only and has no Azure JAR to package.
    # No pull_request_target lane and no checkout ref: a PR-head ref in a read-only job is a CodeQL
    # cache-poisoning finding in every fork (#164). Sync PRs get their image validated on the cascade PR.
    name: "🐳 Docker Build"
    needs: [check-initialization, check-repo-state, java-build]
    if: |
      needs.java-build.outputs.build_result == 'success' &&
      github.event_name != 'pull_request_target' &&
      (vars.SYNC_MODE == 'mirror' ||
       (github.base_ref != 'fork_upstream' && github.ref_name != 'fork_upstream'))
    runs-on: ubuntu-latest
    permissions:
      contents: read          # no packages: write, this job runs untrusted Dockerfile content
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1

      - name: "Service Image"
        uses: ./.github/actions/docker-build
        with:
          push: 'false'
          image_name: ${{ vars.SERVICE_NAME || github.event.repository.name }}
          # Conventional JAR path; the action auto-discovers the Azure JAR when a deviant module name
          # (e.g. entitlements-v2-azure) does not match. SERVICE_TARGET_JAR forces a path (ADR-037).
          jar_file: ${{ vars.SERVICE_TARGET_JAR || format('provider/{0}-azure/target/*-spring-boot.jar', vars.SERVICE_NAME || github.event.repository.name) }}

      - name: "Acceptance Image"
        # Proves every suite's go-offline build before the trusted lane bakes it; skips when no suite exists.
        uses: ./.github/actions/acceptance-image
        with:
          push: 'false'
          image_name: ${{ vars.SERVICE_NAME || github.event.repository.name }}

  docker-push:
    name: "🐳 Docker Push"
    needs: [check-initialization, check-repo-state, java-build, docker-build]
    # Trust boundary (ADR-036): push to GHCR only on trusted events.
    if: |
      (
        needs.java-build.outputs.build_result == 'success' &&
        github.actor != 'dependabot[bot]' &&
        github.event_name != 'pull_request_target' &&
        github.event_name != 'workflow_dispatch' &&
        github.ref_name != 'fork_upstream' &&
        (github.event_name != 'pull_request' ||
         github.event.pull_request.head.repo.full_name == github.repository)
      ) || (
        github.event_name == 'workflow_dispatch' &&
        inputs.force_full_pipeline == true
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write         # only this job has registry write
    outputs:
      image_repository: ${{ steps.push.outputs.image_repository }}
      image_digest: ${{ steps.push.outputs.image_digest }}
      acceptance_image_repository: ${{ steps.acceptance.outputs.image_repository }}
      acceptance_image_digest: ${{ steps.acceptance.outputs.image_digest }}
      acceptance_skipped: ${{ steps.acceptance.outputs.skipped }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: "Docker Build and Push"
        id: push
        uses: ./.github/actions/docker-build
        with:
          push: 'true'
          image_name: ${{ vars.SERVICE_NAME || github.event.repository.name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          jar_file: ${{ vars.SERVICE_TARGET_JAR || format('provider/{0}-azure/target/*-spring-boot.jar', vars.SERVICE_NAME || github.event.repository.name) }}

      - name: "Acceptance Image Build and Push"
        # The suite ships as ghcr.io/<org>/<svc>-acceptance:sha-<sha> from the same commit as the
        # service image. Rides this job to inherit the ADR-036 trust gate; skips when no suite exists.
        id: acceptance
        uses: ./.github/actions/acceptance-image
        with:
          push: 'true'
          image_name: ${{ vars.SERVICE_NAME || github.event.repository.name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  deploy-gate:
    # Decides whether Borrow, Prove, Restore runs and says why when it does not, so the
    # absence of the lane on a run is never silent. Carries the ADR-036 trust clause in full:
    # only a push or a same-repository pull request, never Dependabot, never fork_upstream.
    name: "🚦 Deploy Gate"
    needs: [docker-push]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          sparse-checkout: .spi
          sparse-checkout-cone-mode: false

      - name: "Decide"
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.ref_name }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          ONBOARDED: ${{ vars.SPI_STACK_CLUSTER != '' }}
          CLUSTER: ${{ vars.SPI_STACK_CLUSTER }}
          PUSH_RESULT: ${{ needs.docker-push.result }}
          ACCEPTANCE_SKIPPED: ${{ needs.docker-push.outputs.acceptance_skipped }}
        run: |
          reason=""
          case "$EVENT" in
            push|pull_request) ;;
            *) reason="$EVENT runs never borrow the environment" ;;
          esac
          [ -n "$reason" ] || [ "$EVENT" != "pull_request" ] || [ "$SAME_REPO" = "true" ] || reason="pull request from another repository carries no deploy identity"
          [ -n "$reason" ] || [ "$ACTOR" != "dependabot[bot]" ] || reason="Dependabot updates validate through dependabot-validation.yml"
          [ -n "$reason" ] || [ "$REF" != "fork_upstream" ] || reason="fork_upstream builds no Azure image"
          [ -n "$reason" ] || [ "$ONBOARDED" = "true" ] || reason="repository is not onboarded to a stack (no SPI_STACK_CLUSTER)"
          [ -n "$reason" ] || [ -f .spi/service.yaml ] || reason="no .spi/service.yaml declares the suites"
          [ -n "$reason" ] || [ "$PUSH_RESULT" = "success" ] || reason="no image was pushed (docker-push: $PUSH_RESULT)"
          [ -n "$reason" ] || [ "$ACCEPTANCE_SKIPPED" != "true" ] || reason="descriptor declares no test suite"
          if [ -n "$reason" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "reason=$reason" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy and Test skipped::$reason"
            echo "🚦 Deploy and Test on spi-stack: skipped, $reason" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "reason=" >> "$GITHUB_OUTPUT"
            echo "🚦 Deploy and Test on spi-stack: borrowing $CLUSTER for the pushed image" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-test:
    # Borrow, Prove, Restore (ADR-041): one credentialed job in the fork's spi-stack environment.
    # Pins the image just pushed onto the attached stack, proves it with every suite the
    # descriptor declares, and restores the canonical image whatever happened. A maintainer who
    # wants a human pause before a borrow adds required reviewers to the environment.
    name: "🚀 Deploy and Test on spi-stack"
    needs: [docker-push, deploy-gate]
    if: needs.deploy-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment: spi-stack
    concurrency:
      group: spi-stack-${{ vars.SERVICE_NAME || github.event.repository.name }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      packages: read
    env:
      SERVICE: ${{ vars.SERVICE_NAME || github.event.repository.name }}
      SERVICE_IMAGE: ${{ needs.docker-push.outputs.image_repository }}@${{ needs.docker-push.outputs.image_digest }}
      TEST_IMAGE: ${{ needs.docker-push.outputs.acceptance_image_repository }}@${{ needs.docker-push.outputs.acceptance_image_digest }}
      STACK_REPO: Azure/osdu-spi-stack
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1

      - name: "Azure login (deploy identity)"
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c  # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1

      - name: "Install spi"
        # The latest release first, to reach the environment; the exact release it runs follows.
        id: install
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo az aks install-cli
          tag=$(gh release view --repo "$STACK_REPO" --json tagName --jq .tagName)
          gh release download "$tag" --repo "$STACK_REPO" --pattern "spi-${tag#v}-py3-none-any.whl" --dir "$RUNNER_TEMP/spi" --clobber
          uv tool install "$RUNNER_TEMP/spi/spi-${tag#v}-py3-none-any.whl"
          spi --version

      - name: "Connect"
        run: spi connect --resource-group "${{ vars.SPI_STACK_RESOURCE_GROUP }}" --cluster "${{ vars.SPI_STACK_CLUSTER }}"

      - name: "Match the environment's stack version"
        # The CLI that proves an environment is the release the environment was built with.
        # An environment on a branch (a personal stack tracking main) keeps the latest release.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=$(spi status --json | jq -r '.environment.stackVersion // empty')
          case "$version" in
            v[0-9]*)
              if [ "$(spi --version)" != "spi ${version#v}" ]; then
                gh release download "$version" --repo "$STACK_REPO" --pattern "spi-${version#v}-py3-none-any.whl" --dir "$RUNNER_TEMP/spi" --clobber
                uv tool install --force "$RUNNER_TEMP/spi/spi-${version#v}-py3-none-any.whl"
              fi
              ;;
            *) echo "environment runs ${version:-an unrecorded version}; keeping $(spi --version)" ;;
          esac
          spi --version

      - name: "Gate"
        id: gate
        run: |
          set -euo pipefail
          spi status --json | tee status.json
          jq -e '.deployable == true' status.json > /dev/null || {
            echo "::error::environment is not deployable: $(jq -r '.reason.message // "unknown"' status.json)"; exit 1; }
          spi info --json > facts.json
          echo "audience=$(jq -r .azure.token_audience facts.json)" >> "$GITHUB_OUTPUT"

      - name: "Borrow"
        run: |
          spi service pin "$SERVICE" --image "$SERVICE_IMAGE" \
            --ephemeral --run-id "$GITHUB_RUN_ID" \
            --source-repo "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA" \
            --source-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: "Verify"
        run: |
          set -uo pipefail
          deadline=$((SECONDS + 15 * 60))
          until spi service verify "$SERVICE" --image "$SERVICE_IMAGE" --json | tee verify.json | tail -n1 | jq -e '.outcome == "verified"' > /dev/null; do
            code=$(tail -n1 verify.json | jq -r '.code // empty' 2>/dev/null || true)
            if [ "$code" = "lock_mismatch" ]; then echo "::error::pin replaced mid-borrow"; exit 1; fi
            if [ $SECONDS -ge $deadline ]; then echo "::error::digest not live after 15 minutes"; exit 1; fi
            sleep 20
          done

      - name: "Mint test caller"
        # The deploy identity's own bearer, for the audience the facts publish.
        run: |
          set -euo pipefail
          TOKEN=$(az account get-access-token --resource "${{ steps.gate.outputs.audience }}" --query accessToken -o tsv)
          echo "::add-mask::$TOKEN"
          echo "RESOLVER_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: "Log in to GHCR"
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Prove"
        # One docker run per declared suite, bound by the resolver from the descriptor, the
        # facts, and the minted token, which reaches every binding with source: token.
        run: |
          set -euo pipefail
          failed=""
          python3 .github/actions/acceptance-resolver/resolve.py --contract-only \
            --descriptor .spi/service.yaml --report suites.json > /dev/null
          for suite in $(jq -r '.contract.suites | keys[]' suites.json); do
            echo "::group::suite $suite"
            report="$suite-report.json"
            python3 .github/actions/acceptance-resolver/resolve.py --mode run --suite "$suite" \
              --descriptor .spi/service.yaml --facts facts.json --env-file "$suite.env" --report "$report"
            suite_dir=$(jq -r .contract.test_dir "$report")
            timeout_min=$(jq -r .contract.timeout_minutes "$report")
            mapfile -t mvn_args < <(jq -r '.contract.maven_arguments[]' "$report")
            if timeout "${timeout_min}m" docker run --rm --env-file "$suite.env" -e SUITE_DIR="$suite_dir" "$TEST_IMAGE" "${mvn_args[@]}"; then
              echo "suite $suite: pass" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "suite $suite: FAIL" >> "$GITHUB_STEP_SUMMARY"; failed="$failed $suite"
            fi
            rm -f "$suite.env"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "::error::failed suites:$failed"; exit 1; }

      - name: "Restore"
        if: always() && steps.install.outcome == 'success'
        run: |
          spi service reset "$SERVICE" --if-run "$GITHUB_RUN_ID" --json; code=$?
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ] || exit "$code"

  code-validation:
    name: "✅ Code Quality Checks"
    needs: [check-initialization, check-repo-state, check-paths, java-build]
    if: |
      always() &&
      needs.check-initialization.outputs.initialized == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: "Restore local actions for sync PRs"
        if: |
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.base.ref == 'fork_upstream' &&
          startsWith(github.event.pull_request.head.ref, 'sync/')
        run: |
          set -euo pipefail
          # Sync branches carry no .github/actions; validate with main's trusted copy.
          echo "🔧 Restoring local actions from main branch for sync PR validation..."
          if ! git fetch origin main --depth=1; then
            echo "❌ Failed to fetch 'main' branch from origin. Cannot restore local actions."
            exit 1
          fi
          if ! git checkout origin/main -- .github/actions/; then
            echo "❌ Failed to restore .github/actions/ from origin/main. Cannot proceed with validation."
            exit 1
          fi
          echo "✅ Local actions restored - validation can proceed"

      - name: "Validate Commit Messages"
        if: |
          needs.check-repo-state.outputs.is_initialized == 'true' &&
          github.actor != 'dependabot[bot]' &&
          github.actor != 'copilot' &&
          !contains(github.actor, 'copilot') &&
          !contains(github.event.pull_request.user.login, 'copilot') &&
          github.base_ref == 'main' &&
          !contains(github.head_ref, 'fork_') &&
          !startsWith(github.event.pull_request.title, 'chore(sync)') &&
          !startsWith(github.event.pull_request.title, '⬆️ Sync with upstream') &&
          !startsWith(github.event.pull_request.title, '🚀 Production Release: Upstream Integration') &&
          !startsWith(github.head_ref, 'release/upstream-') &&
          !startsWith(github.head_ref, 'release-please--branches--')
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50  # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
        
      - name: "Check for Merge Conflicts"
        run: |
          if git diff --check; then
            echo "No conflict markers found"
          else
            echo "::error::Conflict markers found in files"
            exit 1
          fi
          
      - name: "Verify Branch Status"
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # A fork PR's head branch does not exist on origin; the base repo
          # advertises every PR head at refs/pull/<n>/head, so fetch that.
          BASE_BRANCH="origin/$BASE_REF"
          CURRENT_BRANCH="refs/remotes/origin/pr-$PR_NUMBER-head"

          git fetch origin "$BASE_REF"
          git fetch origin "+refs/pull/$PR_NUMBER/head:$CURRENT_BRANCH"

          if ! git rev-parse --verify "$BASE_BRANCH" >/dev/null 2>&1; then
            echo "::error::Base branch $BASE_BRANCH not found"
            exit 1
          fi

          if ! git rev-parse --verify "$CURRENT_BRANCH" >/dev/null 2>&1; then
            echo "::error::Head of PR #$PR_NUMBER not found at $CURRENT_BRANCH after fetching refs/pull/$PR_NUMBER/head"
            exit 1
          fi

          BEHIND_BY=$(git rev-list --count "$CURRENT_BRANCH..$BASE_BRANCH")

          if [ "$BEHIND_BY" -gt 0 ]; then
            echo "::error::Branch is behind $BASE_BRANCH by $BEHIND_BY commits. Please update your branch."
            exit 1
          fi

      - name: "Prepare Validation Report"
        id: status
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target'
        run: |
          ITEMS="[]"

          ITEMS=$(echo "$ITEMS" | jq '. + ["✓ No Merge Conflicts"]')
          ITEMS=$(echo "$ITEMS" | jq '. + ["✓ Branch is Up-to-date"]')

          if [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            ITEMS=$(echo "$ITEMS" | jq '. + ["ℹ️ Dependabot Build Handled by dependabot-validation.yml"]')
          elif [[ "${{ needs.check-repo-state.outputs.is_initialized }}" == "true" ]]; then
            if [[ "${{ needs.check-repo-state.outputs.is_java_repo }}" == "true" ]]; then
              if [[ "${{ needs.java-build.result }}" == "success" ]]; then
                ITEMS=$(echo "$ITEMS" | jq '. + ["✓ Java Build Successful"]')
              elif [[ "${{ needs.java-build.result }}" == "skipped" && "${{ needs.check-paths.outputs.should_run }}" == "false" ]]; then
                # A skip for any other reason (e.g. check-paths itself failed) falls through to "Failed".
                ITEMS=$(echo "$ITEMS" | jq '. + ["ℹ️ Java Build Skipped (no build-relevant changes)"]')
              else
                ITEMS=$(echo "$ITEMS" | jq '. + ["❌ Java Build Failed"]')
              fi
            else
              ITEMS=$(echo "$ITEMS" | jq '. + ["ℹ️ Non-Java Repository"]')
            fi
          else
            ITEMS=$(echo "$ITEMS" | jq '. + ["ℹ️ Repository Not Yet Initialized"]')
          fi

          echo "items=$(echo "$ITEMS" | jq -c '.')" >> $GITHUB_OUTPUT

      - name: "Post PR Status"
        # Fork-head pull_request tokens are read-only, so external-fork PRs get no status
        # comment; pull_request_target runs are already gated to same-repo heads.
        if: github.event_name == 'pull_request_target' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: ./.github/actions/pr-status
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.pull_request.number }}
          status_items: ${{ steps.status.outputs.items }}

  validation-summary:
    # The required check (ADR-030): always reports, so a path-skipped or routed-away run never
    # wedges the PR, and one table shows what ran, what was skipped, and why. always() bypasses
    # check-initialization's routing, so the lane test is repeated here.
    name: "📋 Validation Summary"
    needs: [check-initialization, check-repo-state, check-paths, java-build, docker-build, docker-push, deploy-gate, deploy-test, code-validation]
    if: |
      always() &&
      (github.event_name != 'pull_request' ||
       !(github.event.pull_request.head.repo.full_name == github.repository &&
         startsWith(github.event.pull_request.head.ref, 'sync/'))) &&
      (github.event_name != 'pull_request_target' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'sync/')))
    runs-on: ubuntu-latest
    steps:
      - name: "Summarize"
        env:
          NEEDS: ${{ toJSON(needs) }}
          GATE_REASON: ${{ needs.deploy-gate.outputs.reason }}
          INITIALIZED: ${{ needs.check-initialization.outputs.initialized }}
          BUILD_RELEVANT: ${{ needs.check-paths.outputs.should_run }}
          JAVA_REPO: ${{ needs.check-repo-state.outputs.is_java_repo }}
        run: |
          {
            echo "## Validation on ${{ github.event_name }} (${{ github.ref_name }})"
            echo
            echo "| Job | Result | Note |"
            echo "|---|---|---|"
            jq -r --arg gate "$GATE_REASON" --arg init "$INITIALIZED" --arg relevant "$BUILD_RELEVANT" --arg java "$JAVA_REPO" '
              def icon: {success: "✅", failure: "❌", cancelled: "⚠️", skipped: "⏭️"}[.] // .;
              def build: . == "java-build" or . == "docker-build" or . == "docker-push";
              def note:
                if . == "deploy-test" and $gate != "" then $gate
                elif build and $init != "true" then "repository not yet initialized"
                elif build and $relevant == "false" then "only configuration or docs changed"
                elif build and $java != "true" then "not a Java repository"
                else "" end;
              to_entries[] | "| \(.key) | \(.value.result | icon) \(.value.result) | \(.key | note) |"' <<< "$NEEDS"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: "Report"
        # A skipped job is a decision the gates made; only failure and cancellation fail the check.
        # Code quality stays advisory, as it was before the summary became the required check.
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          broken=$(jq -r 'to_entries[] | select(.key != "code-validation")
            | select(.value.result == "failure" or .value.result == "cancelled") | .key' <<< "$NEEDS")
          if [ -n "$broken" ]; then
            echo "❌ failed or cancelled: $(echo $broken | tr ' ' ',')"; exit 1
          fi
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            echo "✅ Validation deferred - the sync lane leaves image validation to the cascade PR"; exit 0
          fi
          echo "✅ Validation completed"
