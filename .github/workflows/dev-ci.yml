name: Template Development CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Only run in the template repository, not in forks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Template
    runs-on: ubuntu-latest
    if: github.event.repository.is_template == true
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v5
        with:
          node-version: '18'
          
      - name: Install yq for YAML validation
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          
      - name: Validate Workflow YAML
        run: |
          validation_failed=false
          
          echo "Validating active workflows..."
          for file in .github/workflows/*.yml; do
            echo "Validating $file"
            if yq e '.' "$file" >/dev/null 2>&1; then
              echo "✅ $file is valid"
            else
              echo "❌ $file has YAML syntax errors"
              validation_failed=true
            fi
          done
          
          echo "Validating template workflows..."
          for file in .github/template-workflows/*.yml; do
            echo "Validating $file"
            if yq e '.' "$file" >/dev/null 2>&1; then
              echo "✅ $file is valid"
            else
              echo "❌ $file has YAML syntax errors"
              validation_failed=true
            fi
          done
          
          if [ "$validation_failed" = "true" ]; then
            echo "❌ YAML validation failed - fix syntax errors above"
            exit 1
          fi
          echo "✅ All YAML files are valid"
          
      - name: Validate JSON Configuration
        run: |
          echo "Validating JSON configuration files..."
          validation_failed=false
          for file in .github/*.json .github/scripts/service-config/schema.json; do
            echo "Validating $file"
            if jq empty "$file"; then
              echo "✅ $file is valid"
            else
              echo "❌ $file has errors"
              validation_failed=true
            fi
          done
          if [ "$validation_failed" = "true" ]; then
            echo "❌ JSON validation failed"
            exit 1
          fi

      - name: Validate Shell Scripts
        run: |
          echo "Checking shell syntax..."
          validation_failed=false
          while IFS= read -r script; do
            if bash -n "$script"; then
              echo "✅ $script"
            else
              echo "❌ $script has syntax errors"
              validation_failed=true
            fi
          done < <(find .github/scripts .github/local-actions .github/actions build -name '*.sh' -type f)
          if [ "$validation_failed" = "true" ]; then
            echo "❌ Shell validation failed"
            exit 1
          fi

      - name: Validate Service Descriptor Tooling
        run: |
          echo "Compiling service-config helpers..."
          python -m compileall -q .github/scripts/service-config
          echo "Round-tripping the example descriptors through the parser..."
          python .github/scripts/service-config/read_service_config.py --root . --format json

      - name: Test workflow summary helpers
        run: python -m unittest discover -s tests -p 'test_*.py' -v
          
      - name: Check Documentation Links
        run: |
          echo "Checking for broken internal documentation links..."
          # Check that ADR references exist
          grep -r "adr/[0-9]" doc/ | while read -r line; do
            file=$(echo "$line" | cut -d: -f1)
            adr_ref=$(echo "$line" | grep -o "adr/[0-9][0-9][0-9]-[^.]*")
            if [ ! -f "doc/$adr_ref.md" ]; then
              echo "❌ Broken ADR reference in $file: $adr_ref"
            else
              echo "✅ Valid ADR reference: $adr_ref"
            fi
          done
          
      - name: Validate Template Structure
        run: |
          echo "Validating template repository structure..."
          
          # Check required files exist
          required_files=(
            "README.md"
            ".github/sync-config.json"
            ".github/labels.json"
            ".github/workflows/init.yml"
            ".github/workflows/init-complete.yml"
            ".github/template-workflows/sync.yml"
            ".github/template-workflows/validate.yml"
            ".github/scripts/service-config/schema.json"
            ".github/scripts/service-config/descriptor.py"
            ".github/scripts/service-config/read_service_config.py"
            ".github/scripts/service-config/generate_descriptor.py"
            ".github/scripts/service-config/generate_codeowners.py"
            ".github/actions/java-build/action.yml"
            ".github/actions/python-build/action.yml"
            ".github/actions/docker-build/action.yml"
            ".github/actions/docker-build/prepare-build-args.sh"
            "build/Dockerfile"
            "build/python/Dockerfile"
          )
          
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ Required file exists: $file"
            else
              echo "❌ Missing required file: $file"
              exit 1
            fi
          done