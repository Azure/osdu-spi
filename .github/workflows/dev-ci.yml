name: Template Development CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upstream-filter-harness:
    name: Upstream Filter Harness
    runs-on: ubuntu-latest
    if: github.repository == 'azure/osdu-spi'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Run harness
        run: bash .github/local-actions/upstream-filter-tests/run-tests.sh

      - name: Run sync state harness
        run: bash .github/local-actions/sync-state-manager-tests/run-tests.sh

      - name: Run acceptance resolver harness
        run: bash .github/local-actions/acceptance-resolver-tests/run-tests.sh

      - name: Run acceptance image harness
        run: bash .github/local-actions/acceptance-image-tests/run-tests.sh

  validate:
    name: Validate Template
    runs-on: ubuntu-latest
    if: github.repository == 'azure/osdu-spi'
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8  # v5.0.0

      - name: Setup Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903  # v6.0.0
        with:
          node-version: '18'
          
      - name: Install yq for YAML validation
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          
      - name: Validate Workflow YAML
        run: |
          validation_failed=false
          
          echo "Validating active workflows..."
          for file in .github/workflows/*.yml; do
            echo "Validating $file"
            if yq e '.' "$file" >/dev/null 2>&1; then
              echo "✅ $file is valid"
            else
              echo "❌ $file has YAML syntax errors"
              validation_failed=true
            fi
          done
          
          echo "Validating template workflows..."
          for file in .github/template-workflows/*.yml; do
            echo "Validating $file"
            if yq e '.' "$file" >/dev/null 2>&1; then
              echo "✅ $file is valid"
            else
              echo "❌ $file has YAML syntax errors"
              validation_failed=true
            fi
          done
          
          if [ "$validation_failed" = "true" ]; then
            echo "❌ YAML validation failed - fix syntax errors above"
            exit 1
          fi
          echo "✅ All YAML files are valid"

      - name: Validate CI de-duplication invariants
        run: |
          set -euo pipefail

          BUILD=".github/template-workflows/build.yml"
          VALIDATE=".github/template-workflows/validate.yml"
          DEPENDABOT=".github/template-workflows/dependabot-validation.yml"

          assert_yq() {
            if ! yq --exit-status "$1" "$2" > /dev/null; then
              echo "::error file=$2::$3"
              exit 1
            fi
          }

          assert_contains() {
            case "$1" in *"$2"*) return 0 ;; esac
            echo "::error::$3"
            exit 1
          }

          # build.yml is push-only; PR events belong to the validation workflows.
          assert_yq '.on.pull_request == null' "$BUILD" \
            "Build workflow must not duplicate protected-branch PR validation"
          assert_yq '.on.push.branches | contains(["!sync/**"])' "$BUILD" \
            "Sync branches must use the Validation workflow"
          assert_yq '.on.push.branches | contains(["!dependabot/**"])' "$BUILD" \
            "Dependabot branches must use the Dependabot Validation workflow"

          # A path-filtered PR trigger leaves the required summary Pending (ADR-030).
          assert_yq '.on.pull_request | has("paths-ignore") | not' "$VALIDATE" \
            "pull_request must stay unfiltered so the required summary always reports"
          assert_yq '.on.pull_request_target | has("paths-ignore") | not' "$VALIDATE" \
            "pull_request_target owns sync PRs and must stay unfiltered"

          # One lane per PR: check-initialization routes, and validation-summary repeats
          # the test because always() bypasses it.
          SYNC_HEAD="github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'sync/')"
          CHECK_INIT_IF=$(yq -r '.jobs."check-initialization".if | sub("\s+"; " ")' "$VALIDATE")
          SUMMARY_IF=$(yq -r '.jobs."validation-summary".if | sub("\s+"; " ")' "$VALIDATE")

          assert_contains "$CHECK_INIT_IF" "(github.event_name == 'pull_request' && !($SYNC_HEAD))" \
            "The pull_request lane must stand down for same-repository sync PRs"
          assert_contains "$CHECK_INIT_IF" "(github.event_name == 'pull_request_target' && $SYNC_HEAD)" \
            "The pull_request_target lane must own same-repository sync PRs, and only those"
          assert_contains "$SUMMARY_IF" "(github.event_name != 'pull_request' || !($SYNC_HEAD))" \
            "The lane that did not build must not report the required summary"
          assert_contains "$SUMMARY_IF" "(github.event_name != 'pull_request_target' || ($SYNC_HEAD))" \
            "The sync lane must report the required summary"

          # Routing lives in check-initialization alone; per-job copies drift apart from it.
          assert_yq '.jobs."java-build".if | contains("head.repo.full_name") | not' "$VALIDATE" \
            "Lane routing belongs in check-initialization, not in java-build"
          assert_yq '.jobs."code-validation".if | contains("head.repo.full_name") | not' "$VALIDATE" \
            "Lane routing belongs in check-initialization, not in code-validation"
          assert_yq '.jobs."java-build".steps[] | select(.id == "build") | .with.generate_coverage | contains("pull_request_target")' "$VALIDATE" \
            "The sync pull_request_target build must generate coverage"

          # A PR-head checkout in the read-only docker-build job is a CodeQL cache-poisoning finding (#164).
          DOCKER_IF=$(yq -r '.jobs."docker-build".if | sub("\s+"; " ")' "$VALIDATE")
          assert_contains "$DOCKER_IF" "github.event_name != 'pull_request_target'" \
            "docker-build must stay out of the pull_request_target lane"
          assert_yq '[.jobs."docker-build".steps[] | select(.uses != null and (.uses | test("actions/checkout"))) | .with.ref == null] | select(length > 0) | all' "$VALIDATE" \
            "docker-build must check out github.sha, never a PR head"

          # The deploy lane inherits docker-push's trust and never enters the pull_request_target lane.
          assert_yq '.jobs."deploy-test".needs | contains(["docker-push", "deploy-gate"])' "$VALIDATE" \
            "deploy-test must chain on docker-push and the deploy gate"
          assert_yq '.jobs."deploy-test".if == "needs.deploy-gate.outputs.run == '"'"'true'"'"'"' "$VALIDATE" \
            "deploy-test must run only when the gate decided to borrow"
          assert_yq '.jobs."deploy-test".environment == "spi-stack"' "$VALIDATE" \
            "deploy-test must run in the spi-stack environment the deploy identity trusts"
          assert_yq '.jobs."deploy-test".concurrency."cancel-in-progress" == false' "$VALIDATE" \
            "A cancelled borrow could skip Restore; queue instead"
          assert_yq '.jobs."deploy-gate".if == "always()"' "$VALIDATE" \
            "deploy-gate must always report why the lane did or did not run"
          # The gate carries the ADR-036 clause itself, never by skip-propagation from docker-push.
          GATE_RUN=$(yq -r '.jobs."deploy-gate".steps[] | select(.id == "decide") | .run' "$VALIDATE")
          assert_contains "$GATE_RUN" 'push|pull_request) ;;' \
            "The gate must refuse every event other than push and pull_request"
          assert_contains "$GATE_RUN" '[ "$SAME_REPO" = "true" ] || reason=' \
            "The gate must admit only same-repository pull requests"
          assert_contains "$GATE_RUN" '[ "$ACTOR" != "dependabot[bot]" ] || reason=' \
            "The gate must refuse Dependabot"
          assert_contains "$GATE_RUN" '[ "$REF" != "fork_upstream" ] || reason=' \
            "The gate must refuse fork_upstream"

          # The ruleset requires the summary by its job name; the two must not drift apart.
          SUMMARY_NAME=$(yq -r '.jobs."validation-summary".name' "$VALIDATE")
          if ! jq --exit-status --arg name "$SUMMARY_NAME" '[.rules[] | select(.type == "required_status_checks") | .parameters.required_status_checks[].context] | index($name)' \
              .github/rulesets/default-branch.json > /dev/null; then
            echo "::error file=.github/rulesets/default-branch.json::must require the validation-summary job by its current name ($SUMMARY_NAME)"
            exit 1
          fi

          # Dependabot owns one build plus one image validation, under its own check name.
          assert_yq '.jobs."java-build".steps[] | select(.id == "build") | .with.maven_profile | contains("core,azure")' "$DEPENDABOT" \
            "Dependabot must produce the Azure JAR used by Docker"
          assert_yq '.jobs."docker-build".needs == "java-build"' "$DEPENDABOT" \
            "Dependabot Docker validation must consume its Java build"
          assert_yq '.jobs."docker-build".name | contains("Dependabot")' "$DEPENDABOT" \
            "Dependabot Docker validation needs a check name distinct from validate.yml's"
          assert_yq '.jobs."docker-build".steps[] | select(.name == "Docker Build (validate-only)") | .with.push == "false"' "$DEPENDABOT" \
            "Dependabot Docker validation must never push an image"

          ISSUE_IF=$(yq -r '.jobs."create-issue-on-failure".if | sub("\s+"; " ")' "$DEPENDABOT")
          case "$ISSUE_IF" in
            *"!= 'success'"*)
              echo "::error file=$DEPENDABOT::A skipped prerequisite is not a Dependabot build failure"
              exit 1 ;;
          esac

          echo "✅ CI de-duplication invariants hold"

      - name: Validate JSON Configuration
        run: |
          echo "Validating JSON configuration files..."
          for file in .github/*.json; do
            echo "Validating $file"
            jq empty "$file" && echo "✅ $file is valid" || echo "❌ $file has errors"
          done
          
      - name: Check Documentation Links
        run: |
          echo "Checking for broken internal documentation links..."
          grep -r "adr/[0-9]" doc/ | while read -r line; do
            file=$(echo "$line" | cut -d: -f1)
            adr_ref=$(echo "$line" | grep -o "adr/[0-9][0-9][0-9]-[^.]*")
            if [ ! -f "doc/$adr_ref.md" ]; then
              echo "❌ Broken ADR reference in $file: $adr_ref"
            else
              echo "✅ Valid ADR reference: $adr_ref"
            fi
          done
          
      - name: Validate Template Structure
        run: |
          echo "Validating template repository structure..."

          required_files=(
            "README.md"
            ".github/sync-config.json"
            ".github/labels.json"
            ".github/workflows/init.yml"
            ".github/workflows/init-complete.yml"
            ".github/template-workflows/sync.yml"
            ".github/template-workflows/validate.yml"
          )
          
          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✅ Required file exists: $file"
            else
              echo "❌ Missing required file: $file"
              exit 1
            fi
          done
