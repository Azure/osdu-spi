name: Fleet Release

# Marks a point in time across the fork fleet: one fleet-YYYY.MM.DD release in osdu-spi with
# bom.json attached. Service versions stay whatever release-please gave each fork.
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Fleet release date, YYYY-MM-DD (default: today in UTC)'
        required: false
        type: string
      template_target:
        description: 'Template commit a fork release must include (default: the dispatched commit)'
        required: false
        type: string
      publish:
        description: 'Publish the fleet release; otherwise bom.json is only a run artifact'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: fleet-release
  cancel-in-progress: false

jobs:
  build:
    name: "Build BOM"
    if: github.repository == 'azure/osdu-spi'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          fetch-depth: 0

      - name: "Generate GitHub App Token"
        # Reads UPSTREAM_REPO_URL from each fork; without it upstreamRepository is recorded as null.
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: "Build bom.json"
        id: build
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          DATE_INPUT: ${{ inputs.date }}
          TARGET_INPUT: ${{ inputs.template_target }}
        run: |
          set -euo pipefail
          date="${DATE_INPUT:-$(date -u +%F)}"
          target="${TARGET_INPUT:-$GITHUB_SHA}"
          python3 .github/scripts/fleet-release/bom.py build \
            --date "$date" --template-target "$target" --out bom.json --summary "$GITHUB_STEP_SUMMARY"
          echo "tag=fleet-${date//-/.}" >> "$GITHUB_OUTPUT"

      - name: "Upload bom.json"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: bom
          path: bom.json
          if-no-files-found: error

  publish:
    name: "Publish ${{ needs.build.outputs.tag }}"
    needs: build
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          sparse-checkout: .github/scripts/fleet-release
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: bom

      - name: "Publish the fleet release"
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/fleet-release/bom.py publish --bom bom.json --repo "$GITHUB_REPOSITORY"
